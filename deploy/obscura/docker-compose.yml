services:
  obscura:
    build:
      context: .
      args:
        OBSCURA_VERSION: ${OBSCURA_VERSION:-latest}
    image: pigo-obscura:${OBSCURA_VERSION:-latest}
    command:
      - serve
      - --port
      - "${OBSCURA_PORT:-9222}"
      - --stealth
      - --workers
      - "${OBSCURA_WORKERS:-1}"
    network_mode: host
    restart: unless-stopped
    shm_size: "512mb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${OBSCURA_PORT:-9222}/json/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
